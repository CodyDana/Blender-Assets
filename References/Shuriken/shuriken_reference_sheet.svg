<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <title>Shuriken Reference Sheet - schematic top views to a common scale</title>
  <desc>Schematic outlines of eight shuriken forms drawn from build-to dimensions at 2 px per mm. Generated from measured numbers, not traced from any photograph.</desc>

  <style>
    .bg   { fill:#ffffff; }
    .out  { fill:none; stroke:#000000; stroke-width:1.6; stroke-linejoin:round; }
    .hole { fill:#ffffff; stroke:#000000; stroke-width:1.4; }
    .side { fill:#000000; stroke:none; }
    .rule { fill:none; stroke:#000000; stroke-width:1; }
    .axis { fill:none; stroke:#000000; stroke-width:0.6; stroke-dasharray:6 4; opacity:0.45; }
    .hdr  { font-family:Georgia,serif; font-size:26px; fill:#000; }
    .sub  { font-family:Georgia,serif; font-size:13px; fill:#000; font-style:italic; }
    .nm   { font-family:Georgia,serif; font-size:15px; fill:#000; font-weight:bold; }
    .jp   { font-family:Yu Gothic,MS Gothic,sans-serif; font-size:12px; fill:#000; }
    .dim  { font-family:Consolas,monospace; font-size:11.5px; fill:#000; }
    .src  { font-family:Georgia,serif; font-size:10.5px; fill:#000; font-style:italic; }
    .tick { font-family:Consolas,monospace; font-size:10px; fill:#000; }
  </style>

  <rect class="bg" x="0" y="0" width="1600" height="1000"/>

  <!-- ===== header ===== -->
  <text class="hdr" x="40" y="40">Shuriken Reference Sheet &#8212; schematic top views, common scale</text>
  <text class="sub" x="40" y="60">All forms drawn at 2 px = 1 mm from the build-to dimensions in SHURIKEN_STUDY.md. Diagram generated from numbers, not traced from any photograph. 2026-09-17.</text>
  <line class="rule" x1="40" y1="72" x2="1560" y2="72"/>

  <!-- ===== ROW 1 ===== -->

  <!-- 1. JUJI 4-point : across 97mm, arm 11mm, hub r 11mm, tip 40deg, plate 3.0mm -->
  <g>
    <line class="axis" x1="205" y1="118" x2="205" y2="342"/>
    <line class="axis" x1="93" y1="230" x2="317" y2="230"/>
    <path class="out" d="M194.0 210.9L194.0 163.2L205.0 133.0L216.0 163.2L216.0 210.9A22.0 22.0 0 0 1 224.1 219.0L271.8 219.0L302.0 230.0L271.8 241.0L224.1 241.0A22.0 22.0 0 0 1 216.0 249.1L216.0 296.8L205.0 327.0L194.0 296.8L194.0 249.1A22.0 22.0 0 0 1 185.9 241.0L138.2 241.0L108.0 230.0L138.2 219.0L185.9 219.0A22.0 22.0 0 0 1 194.0 210.9Z"/>
    <circle class="hole" cx="205" cy="230" r="8"/>
    <text class="nm"  x="40" y="366">1 &#183; FOUR-POINT STAR</text>
    <text class="jp"  x="40" y="384">十字 / 四方剣 &#8212; juji / shiho &#183; hira-shuriken</text>
    <text class="dim" x="40" y="401">97 mm across &#183; 3.0 mm plate &#183; 8 mm hole</text>
    <text class="dim" x="40" y="416">arm 11 mm &#183; tip 40&#176; &#183; pitch 90&#176; &#183; symmetry C4</text>
    <rect class="side" x="108" y="428" width="194" height="6"/>
    <text class="dim" x="40" y="450">side view, true scale &#8212; 3.0 mm</text>
    <text class="src" x="40" y="466">39 g &#8212; SOURCED (museum-shop replica 97 x 97 x 3 mm, 39 g)</text>
  </g>

  <!-- 2. HAPPO 8-point : across 100mm, arm 10mm, hub r 22mm, tip 35deg, plate 2.5mm -->
  <g>
    <line class="axis" x1="595" y1="118" x2="595" y2="342"/>
    <line class="axis" x1="483" y1="230" x2="707" y2="230"/>
    <path class="out" d="M585.0 187.2L585.0 161.7L595.0 130.0L605.0 161.7L605.0 187.2A44.0 44.0 0 0 1 618.2 192.6L636.2 174.6L665.7 159.3L650.4 188.8L632.4 206.8A44.0 44.0 0 0 1 637.8 220.0L663.3 220.0L695.0 230.0L663.3 240.0L637.8 240.0A44.0 44.0 0 0 1 632.4 253.2L650.4 271.2L665.7 300.7L636.2 285.4L618.2 267.4A44.0 44.0 0 0 1 605.0 272.8L605.0 298.3L595.0 330.0L585.0 298.3L585.0 272.8A44.0 44.0 0 0 1 571.8 267.4L553.8 285.4L524.3 300.7L539.6 271.2L557.6 253.2A44.0 44.0 0 0 1 552.2 240.0L526.7 240.0L495.0 230.0L526.7 220.0L552.2 220.0A44.0 44.0 0 0 1 557.6 206.8L539.6 188.8L524.3 159.3L553.8 174.6L571.8 192.6A44.0 44.0 0 0 1 585.0 187.2Z"/>
    <circle class="hole" cx="595" cy="230" r="9.5"/>
    <text class="nm"  x="430" y="366">2 &#183; EIGHT-POINT STAR</text>
    <text class="jp"  x="430" y="384">八方 &#8212; happo-gata &#183; hira-shuriken</text>
    <text class="dim" x="430" y="401">100 mm across &#183; 2.5 mm plate &#183; 9.5 mm hole</text>
    <text class="dim" x="430" y="416">arm 10 mm &#183; tip 35&#176; &#183; pitch 45&#176; &#183; symmetry C8</text>
    <rect class="side" x="495" y="428" width="200" height="5"/>
    <text class="dim" x="430" y="450">side view, true scale &#8212; 2.5 mm</text>
    <text class="src" x="430" y="466">60 g &#8212; DERIVED (museum piece, modern: Taiwan c.1980, 102 x 2.5 mm, 57.5 g)</text>
  </g>

  <!-- 3. ROPPO 6-point : across 98mm, arm 11mm, hub r 18mm, tip 38deg, plate 2.0mm -->
  <g>
    <line class="axis" x1="985" y1="118" x2="985" y2="342"/>
    <line class="axis" x1="873" y1="230" x2="1097" y2="230"/>
    <path class="out" d="M974.0 195.7L974.0 163.9L985.0 132.0L996.0 163.9L996.0 195.7A36.0 36.0 0 0 1 1009.2 203.3L1036.7 187.4L1069.9 181.0L1047.7 206.5L1020.2 222.4A36.0 36.0 0 0 1 1020.2 237.6L1047.7 253.5L1069.9 279.0L1036.7 272.6L1009.2 256.7A36.0 36.0 0 0 1 996.0 264.3L996.0 296.1L985.0 328.0L974.0 296.1L974.0 264.3A36.0 36.0 0 0 1 960.8 256.7L933.3 272.6L900.1 279.0L922.3 253.5L949.8 237.6A36.0 36.0 0 0 1 949.8 222.4L922.3 206.5L900.1 181.0L933.3 187.4L960.8 203.3A36.0 36.0 0 0 1 974.0 195.7Z"/>
    <circle class="hole" cx="985" cy="230" r="8"/>
    <text class="nm"  x="820" y="366">3 &#183; SIX-POINT STAR</text>
    <text class="jp"  x="820" y="384">六方 &#8212; roppo-gata (kagome) &#183; hira-shuriken</text>
    <text class="dim" x="820" y="401">98 mm across &#183; 2.0 mm plate &#183; 8 mm hole</text>
    <text class="dim" x="820" y="416">arm 11 mm &#183; tip 38&#176; &#183; pitch 60&#176; &#183; symmetry C6</text>
    <rect class="side" x="887" y="428" width="196" height="4"/>
    <text class="dim" x="820" y="450">side view, true scale &#8212; 2.0 mm</text>
    <text class="src" x="820" y="466">40 g &#8212; SOURCED (retail 9.8 cm, 2 mm, 40 g)</text>
  </g>

  <!-- 4. SENBAN : diagonal 108mm, side 76mm, concave sagitta 6mm, square hole 12.7mm, plate 1.9mm -->
  <g>
    <line class="axis" x1="1375" y1="112" x2="1375" y2="348"/>
    <line class="axis" x1="1257" y1="230" x2="1493" y2="230"/>
    <path class="out" d="M1375.0 122.0Q1412.0 193.0 1483.0 230.0Q1412.0 267.0 1375.0 338.0Q1338.0 267.0 1267.0 230.0Q1338.0 193.0 1375.0 122.0Z"/>
    <rect class="hole" x="1362.3" y="217.3" width="25.4" height="25.4"/>
    <text class="nm"  x="1210" y="366">4 &#183; SQUARE PLATE STAR</text>
    <text class="jp"  x="1210" y="384">銛盤 &#8212; senban &#183; hira-shuriken</text>
    <text class="dim" x="1210" y="401">108 mm diagonal &#183; 76 mm side &#183; 1.9 mm plate</text>
    <text class="dim" x="1210" y="416">square hole 12.7 mm &#183; sides concave 6 mm &#183; C4</text>
    <rect class="side" x="1267" y="428" width="216" height="3.8"/>
    <text class="dim" x="1210" y="450">side view, true scale &#8212; 1.9 mm (14 gauge)</text>
    <text class="src" x="1210" y="466">66 g &#8212; DERIVED (repro 8 cm, 2 mm, about 60 g)</text>
  </g>

  <!-- ===== ROW 2 ===== -->

  <!-- 5. MANJI : corner-to-corner 100mm, arm 13mm, stem 36mm, hook 20mm, plate 2.5mm.
       Outline traced clockwise as the union of a 26x26 px centre square, four 26x72 px arms
       and four 26x40 px hooks. Hook and arm share an edge, never a single corner.
       Left-facing manji: with one arm up, its hook turns to the viewer's left.
       Shoelace area = 12324 px2 = 3081 mm2 = 60.5 g at 2.5 mm and 7.85 g/cm3. -->
  <g>
    <line class="axis" x1="205" y1="490" x2="205" y2="710"/>
    <line class="axis" x1="95" y1="600" x2="315" y2="600"/>
    <path class="out" d="M192.0 587.0L192.0 541.0L152.0 541.0L152.0 515.0L218.0 515.0L218.0 587.0L264.0 587.0L264.0 547.0L290.0 547.0L290.0 613.0L218.0 613.0L218.0 659.0L258.0 659.0L258.0 685.0L192.0 685.0L192.0 613.0L146.0 613.0L146.0 653.0L120.0 653.0L120.0 587.0Z"/>
    <text class="nm"  x="40" y="736">5 &#183; HOOKED CROSS STAR</text>
    <text class="jp"  x="40" y="754">卍字剣 &#8212; manji-gata &#183; hira-shuriken</text>
    <text class="dim" x="40" y="771">100 mm corner to corner &#183; 85 mm across arms</text>
    <text class="dim" x="40" y="786">arm 13 &#183; stem 36 &#183; hook 20 mm &#183; C4, no mirror</text>
    <rect class="side" x="105" y="798" width="200" height="5"/>
    <text class="dim" x="40" y="820">side view 2.5 mm &#183; centre hole unconfirmed</text>
    <text class="src" x="40" y="836">60 g &#8212; DERIVED. Left-facing 卍: top arm hooks LEFT.</text>
    <text class="src" x="40" y="850">Never mirror it. 1962 TV-prop shape; public domain.</text>
  </g>

  <!-- 6. SANPO 3-point : tip circle 100mm, arm 16mm, hub r 16mm, tip 42deg, plate 2.5mm.
       Bounding box with one tip up is 86.6 mm wide by 75.0 mm tall. -->
  <g>
    <line class="axis" x1="595" y1="490" x2="595" y2="710"/>
    <line class="axis" x1="485" y1="600" x2="705" y2="600"/>
    <path class="out" d="M579.0 572.3L579.0 541.7L595.0 500.0L611.0 541.7L611.0 572.3A32.0 32.0 0 0 1 627.0 600.0L653.5 615.3L681.6 650.0L637.5 643.0L611.0 627.7A32.0 32.0 0 0 1 579.0 627.7L552.5 643.0L508.4 650.0L536.5 615.3L563.0 600.0A32.0 32.0 0 0 1 579.0 572.3Z"/>
    <circle class="hole" cx="595" cy="600" r="8"/>
    <text class="nm"  x="430" y="736">6 &#183; THREE-POINT STAR</text>
    <text class="jp"  x="430" y="754">三方 &#8212; sanpo-gata &#183; hira-shuriken</text>
    <text class="dim" x="430" y="771">100 mm tip circle &#183; 87 mm tip-to-tip &#183; 2.5 mm plate</text>
    <text class="dim" x="430" y="786">arm 16 mm &#183; tip 42&#176; &#183; pitch 120&#176; &#183; C3 &#183; 8 mm hole</text>
    <rect class="side" x="495" y="798" width="200" height="5"/>
    <text class="dim" x="430" y="820">side view 2.5 mm &#183; box 87 wide x 75 tall, tip up</text>
    <text class="src" x="430" y="836">37 g &#8212; DERIVED (museum 3-point, modern: Taiwan 20th c., 82 mm, 44.5 g)</text>
  </g>

  <!-- 7. THROWING SPIKE (Katori / Meifu Shinkage pattern) : 150mm x 6mm square -->
  <g>
    <line class="axis" x1="825" y1="600" x2="1145" y2="600"/>
    <path class="out" d="M835.0 597.0L875.0 594.0L1085.0 594.0L1135.0 600.0L1085.0 606.0L875.0 606.0L835.0 603.0Z"/>
    <rect class="out" x="979" y="646" width="12" height="12"/>
    <text class="dim" x="998" y="656">section 6 x 6 mm</text>
    <text class="nm"  x="820" y="736">7 &#183; THROWING SPIKE</text>
    <text class="jp"  x="820" y="754">棒手裏剣 &#8212; bo-shuriken (Katori / MSR pattern)</text>
    <text class="dim" x="820" y="771">150 mm long &#183; 6 mm square section</text>
    <text class="dim" x="820" y="786">point 25 mm &#183; tail taper 20 mm to 3 mm &#183; C4 about axis</text>
    <text class="dim" x="820" y="820">the drawing above IS the side view, true scale</text>
    <text class="src" x="820" y="836">37 g &#8212; SOURCED (school spec plus two retailers)</text>
  </g>

  <!-- 8. TASSELLED DART (Negishi pattern) : 140mm, head 11mm across flats -->
  <g>
    <line class="axis" x1="1185" y1="600" x2="1525" y2="600"/>
    <path class="out" d="M1515.0 600.0L1465.0 589.0L1435.0 589.0L1235.0 595.0L1235.0 605.0L1435.0 611.0L1465.0 611.0Z"/>
    <path class="rule" d="M1235 598L1198 590M1235 600L1194 600M1235 602L1198 610M1235 597L1204 586M1235 603L1204 614"/>
    <text class="dim" x="1194" y="636">tail tassel</text>
    <text class="nm"  x="1210" y="736">8 &#183; TASSELLED THROWING DART</text>
    <text class="jp"  x="1210" y="754">棒手裏剣 &#8212; bo-shuriken (Negishi pattern)</text>
    <text class="dim" x="1210" y="771">140 mm long &#183; head 11 mm across flats [ESTIMATE]</text>
    <text class="dim" x="1210" y="786">octagonal head, front-heavy &#183; lacquered hair tail</text>
    <text class="dim" x="1210" y="820">the drawing above IS the side view, true scale</text>
    <text class="src" x="1210" y="836">50 g &#8212; WEAKLY SOURCED. Head diameter unconfirmed</text>
  </g>

  <!-- ===== footer: scale ruler + legend ===== -->
  <line class="rule" x1="40" y1="880" x2="1560" y2="880"/>

  <text class="dim" x="40" y="906">SCALE &#8212; 2 px = 1 mm</text>
  <path class="rule" d="M100.0 920v10M110.0 920v5M120.0 920v10M130.0 920v5M140.0 920v10M150.0 920v5M160.0 920v10M170.0 920v5M180.0 920v10M190.0 920v5M200.0 920v10M210.0 920v5M220.0 920v10M230.0 920v5M240.0 920v10M250.0 920v5M260.0 920v10M270.0 920v5M280.0 920v10M290.0 920v5M300.0 920v10"/>
  <line class="rule" x1="100" y1="920" x2="300" y2="920"/>
  <text class="tick" x="96"  y="948">0</text>
  <text class="tick" x="136" y="948">2</text>
  <text class="tick" x="176" y="948">4</text>
  <text class="tick" x="216" y="948">6</text>
  <text class="tick" x="256" y="948">8</text>
  <text class="tick" x="288" y="948">10 cm</text>
  <text class="tick" x="100" y="966">major tick 10 mm &#183; minor tick 5 mm</text>

  <text class="dim" x="430" y="906">READING THE OUTLINES</text>
  <text class="src" x="430" y="924">Solid line = plate outline. White circle or square = pierced hole.</text>
  <text class="src" x="430" y="940">Dashed lines = symmetry axes. Black bar = plate thickness, true scale.</text>
  <text class="src" x="430" y="956">Tip angle is the included angle between the two ground edges of one point.</text>
  <text class="src" x="430" y="972">Arm width is the parallel section between hub and shoulder.</text>

  <text class="dim" x="980" y="906">STATUS OF THE NUMBERS</text>
  <text class="src" x="980" y="924">SOURCED = a measured museum, school or retail figure. See sources.md.</text>
  <text class="src" x="980" y="940">DERIVED = outline area x thickness x 7.85 g/cm3, checked against sourced pieces.</text>
  <text class="src" x="980" y="956">ESTIMATE = no measured source found; reasoned value, flagged in the study.</text>
  <text class="src" x="980" y="972">No source publishes a tip angle or notch depth; all are modelling defaults.</text>
</svg>
